title: Open Astrophysics Learning
description: Learn stellar astrophysics through real data, Python, and scientific thinking — free and open source.
theme: null
remote_theme: just-the-docs/just-the-docs

url: https://open-astro-lab.github.io
baseurl: /open-astrophysics-learning

permalink: pretty
exclude: ["node_modules/", "*.gemspec", "*.gem", "Gemfile", "Gemfile.lock"]

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

heading_anchors: true

nav_sort: case_insensitive

aux_links:
  "Enroll free":
    - "https://tally.so/r/xX75PJ"
  "Open Astro Physics Lab":
    - "https://openastrophysicslab.wixsite.com/open-astro-physics-l"
  "GitHub":
    - "https://github.com/open-astro-lab/open-astrophysics-learning"

aux_links_new_tab: true

footer_content: "Open Astrophysics Learning · Free · Open source · Built for curious minds everywhere"

color_scheme: dark

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/open-astro-lab/open-astrophysics-learning"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
